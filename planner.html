<!doctype html>
<html lang="en-ZA" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Lighting Planner | Design Your Light · The Lighting Warehouse</title>
<meta name="description" content="Answer six quick questions and get a complete lighting plan for your room: ambient, task and accent lights from The Lighting Warehouse range, quantities worked out from lumens, matching globes and a total.">
<meta property="og:title" content="AI Lighting Planner | Design Your Light · The Lighting Warehouse">
<meta property="og:description" content="Answer six quick questions and get a complete lighting plan for your room: ambient, task and accent lights from The Lighting Warehouse range, quantities worked out from lumens, matching globes and a total.">
<meta property="og:image" content="assets/img/tlw-logo.png">
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" href="assets/img/tlw-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://lightingwarehouse.co.za">
<link rel="stylesheet" href="assets/css/tlw.css">
<link rel="stylesheet" href="assets/css/explore.css">
<script>try{var t=localStorage.getItem("tlw-theme");if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
</head>
<body data-page="planner">
<main id="main">
<section class="pl" data-lamp-host aria-labelledby="plTitle">
  <h1 class="sr-only" id="plTitle">Lighting planner: design your light</h1>
  <div class="wrap pl-top">
    <div class="row-b" style="margin-bottom:16px;flex-wrap:wrap">
      <span class="eyebrow">AI Lighting Planner · Design your light</span>
      <button class="link-u" type="button" id="plRestart" hidden>Start again ↺</button>
    </div>
    <ol class="pl-steps" id="plSteps" aria-label="Planner steps"></ol>
  </div>
  <div class="wrap pl-stage" id="plStage" aria-live="polite"></div>
  <div class="wrap pl-navwrap" id="plNavWrap">
    <div class="pl-nav">
      <button class="btn ghost sm" type="button" id="plBack" disabled>← Back</button>
      <span class="count" id="plCount">Step 1 of 6</span>
      <button class="btn sm" type="button" id="plNext" disabled>Next <span class="arr">→</span></button>
    </div>
  </div>
</section>
<div id="plResult"></div>

<div class="modal x-modal" id="plMail" role="dialog" aria-modal="true" aria-labelledby="plMailH" aria-hidden="true">
  <div class="scrim-in" data-mclose></div>
  <div class="box">
    <button class="icon-btn x" type="button" data-mclose aria-label="Close">✕</button>
    <span class="eyebrow">Your lighting plan</span>
    <h2 class="h3 mt-s" id="plMailH">Email me this <em>plan</em></h2>
    <p class="mt-s" style="margin-bottom:0">We'll send the full plan with product links, quantities and the total, so you can share it with your electrician or partner.</p>
    <form class="x-form" id="plMailForm">
      <div class="field full"><label for="plEmail">Email address</label><input id="plEmail" type="email" required autocomplete="email" placeholder="you@example.co.za"></div>
      <label class="check full"><input type="checkbox"> Also send me lighting tips and deals</label>
      <div class="full flex"><button class="btn" type="submit">Send my plan <span class="arr">→</span></button><span class="demo-note">Demo · no email is sent</span></div>
    </form>
  </div>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="assets/js/data-static.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/chat.js"></script>
<script src="assets/js/planner.js"></script>
</body>
</html>
