<!doctype html>
<html lang="en-ZA" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Account | The Lighting Warehouse</title>
<meta name="description" content="Your Lighting Warehouse account: orders and tracking, quick reorder, wishlist, saved addresses, saved AI room plans and reviews.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" href="assets/img/tlw-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://lightingwarehouse.co.za">
<link rel="stylesheet" href="assets/css/tlw.css">
<link rel="stylesheet" href="assets/css/service.css">
<script>try{var t=localStorage.getItem("tlw-theme");if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
</head>
<body data-page="account">
<main id="main" data-lamp-host>

<!-- signed out: the membership card -->
<section class="ac-gate" id="acGate" aria-labelledby="acGateH">
  <div class="pic">
    <img src="https://lightingwarehouse.co.za/wp-content/uploads/2025/12/Website-BedroomLighting-03.jpg" alt="A warmly lit bedroom with pendant lights">
    <h1 id="acGateH" data-lines>Your light,<br><em>kept.</em></h1>
  </div>
  <div class="side">
    <form class="ac-card fade-up" id="acSign" novalidate>
      <div class="chipline"><span class="eyebrow">TLW Account</span><i aria-hidden="true"></i></div>
      <h2>Welcome back.</h2>
      <p style="font-size:15px;margin:0">Orders, tracking, your wishlist and the room plans you've made with our AI planner, all in one place.</p>
      <div class="field"><label for="aName">First name</label><input id="aName" name="name" autocomplete="given-name" placeholder="Thandi"></div>
      <div class="field"><label for="aEmail">Email</label><input id="aEmail" name="email" type="email" required autocomplete="email" placeholder="you@example.co.za"></div>
      <button class="btn" type="submit">Continue <span class="arr">→</span></button>
      <p class="sv-err" id="aErr" role="alert" style="margin:0;min-height:0"></p>
      <div class="or">or</div>
      <button class="btn ghost" type="button" id="acGuest">Continue as guest</button>
      <p class="demo-note" style="margin:0">Demo account: no password, nothing leaves your browser</p>
    </form>
  </div>
</section>

<!-- signed in: the dashboard -->
<div id="acDash" hidden>
  <section class="ac-band" aria-labelledby="acHi">
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><b aria-current="page">My account</b></nav>
      <div class="row-b">
        <h1 id="acHi">Good evening.</h1>
        <div class="ac-stats" id="acStats"></div>
      </div>
    </div>
  </section>
  <div class="wrap">
    <div class="ac-dash">
      <div class="ac-rail" role="tablist" aria-label="Account sections" aria-orientation="vertical" id="acRail">
        <button role="tab" id="t-orders" aria-controls="p-orders" aria-selected="true" data-tab="orders">Orders <span class="sv-count" data-c="orders"></span></button>
        <button role="tab" id="t-wishlist" aria-controls="p-wishlist" aria-selected="false" tabindex="-1" data-tab="wishlist">Wishlist <span class="sv-count" data-c="wishlist"></span></button>
        <button role="tab" id="t-addresses" aria-controls="p-addresses" aria-selected="false" tabindex="-1" data-tab="addresses">Addresses <span class="sv-count" data-c="addresses"></span></button>
        <button role="tab" id="t-plans" aria-controls="p-plans" aria-selected="false" tabindex="-1" data-tab="plans">Room plans <span class="sv-count" data-c="plans"></span></button>
        <button role="tab" id="t-reviews" aria-controls="p-reviews" aria-selected="false" tabindex="-1" data-tab="reviews">Reviews <span class="sv-count" data-c="reviews"></span></button>
        <button type="button" class="out" id="acOut">Sign out</button>
      </div>
      <div>
        <section class="ac-panel" role="tabpanel" id="p-orders" aria-labelledby="t-orders" tabindex="0"></section>
        <section class="ac-panel" role="tabpanel" id="p-wishlist" aria-labelledby="t-wishlist" tabindex="0" hidden></section>
        <section class="ac-panel" role="tabpanel" id="p-addresses" aria-labelledby="t-addresses" tabindex="0" hidden></section>
        <section class="ac-panel" role="tabpanel" id="p-plans" aria-labelledby="t-plans" tabindex="0" hidden></section>
        <section class="ac-panel" role="tabpanel" id="p-reviews" aria-labelledby="t-reviews" tabindex="0" hidden></section>
        <section class="ac-panel" role="tabpanel" id="p-newsletter" aria-labelledby="t-newsletter" tabindex="0" hidden></section>
      </div>
    </div>
  </div>
</div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="assets/js/data-static.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/chat.js"></script>
<script src="assets/js/service.js"></script>
</body>
</html>
