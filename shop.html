<!doctype html>
<html lang="en-ZA" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop Lighting | The Gallery · The Lighting Warehouse</title>
<meta name="description" content="Shop pendants, chandeliers, ceiling fans, outdoor and solar lights, LED globes and switches from The Lighting Warehouse. Filter by finish, room and globe type. Free delivery over R500.">
<meta property="og:title" content="The Gallery · The Lighting Warehouse">
<meta property="og:description" content="Every light, hung like art. Indoor, outdoor, fans, globes and switches from South Africa's leading independent lighting retailer.">
<meta property="og:image" content="assets/img/tlw-logo.png">
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" href="assets/img/tlw-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://lightingwarehouse.co.za">
<link rel="stylesheet" href="assets/css/tlw.css">
<link rel="stylesheet" href="assets/css/shop.css">
<script>try{var t=localStorage.getItem("tlw-theme");if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
</head>
<body data-page="shop">
<main id="main">

<!-- [01] Cinematic gallery header -->
<header class="g-head" data-lamp-host aria-labelledby="gTitle">
  <div class="g-head-bg" aria-hidden="true"><img id="gHeadImg" src="https://lightingwarehouse.co.za/wp-content/uploads/2026/06/Shop-Dublin.jpg" alt=""></div>
  <div class="g-head-veil" aria-hidden="true"></div>
  <div class="wrap g-head-in">
    <nav class="crumbs" aria-label="Breadcrumb" id="gCrumbs"><a href="index.html">Home</a><span>/</span><a href="shop.html">Shop</a></nav>
    <div class="g-head-grid">
      <div class="g-title-col">
        <span class="num" id="gKicker">— 01 / The Gallery</span>
        <h1 class="g-title" id="gTitle" data-lines>Every<br><em>light</em></h1>
      </div>
      <aside class="g-card fade-up" aria-label="About this collection">
        <div class="g-count"><b id="gCount">—</b><span id="gCountLbl">pieces on show</span></div>
        <p class="g-intro" id="gIntro">Pendants, fans, lanterns and globes, chosen by a family that has lived with light since 1974.</p>
        <div class="g-parsed" id="gParsed" hidden></div>
      </aside>
    </div>
  </div>
  <div class="g-scrollcue" aria-hidden="true"><i></i><span>Enter the gallery</span></div>
</header>

<!-- [02] Sub-category strip + toolbar -->
<div class="g-subs-wrap">
  <div class="wrap"><nav class="g-subs hscroll" id="gSubs" aria-label="Sub-categories"></nav></div>
</div>

<div class="g-bar" id="gBar">
  <div class="wrap g-bar-in">
    <button class="g-filter-btn" id="gFilterBtn" aria-controls="gPanel" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="18" height="18" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      Filter <span class="g-fcount" id="gFcount" hidden>0</span>
    </button>
    <div class="g-active hscroll" id="gActive" aria-label="Active filters"></div>
    <p class="g-result" id="gResult" aria-live="polite"></p>
    <label class="g-sort"><span class="sr-only">Sort by</span>
      <select id="gSort">
        <option value="feat">Featured</option>
        <option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option>
        <option value="az">Name: A to Z</option>
        <option value="new">Newest in</option>
        <option value="sale">On sale first</option>
      </select>
    </label>
    <button class="g-lights" id="gLights" aria-pressed="false" title="Switch every light on in the dark">
      <span class="g-lights-sw" aria-hidden="true"><i></i></span><span class="g-lights-t">Lights off</span>
    </button>
  </div>
</div>

<!-- [03] The grid -->
<section class="g-hall" id="gHall" aria-label="Products">
  <div class="wrap">
    <div class="g-grid" id="gGrid" aria-busy="true"></div>
    <div class="g-more" id="gMore">
      <div class="g-progress" aria-hidden="true"><i id="gProg"></i></div>
      <p class="g-shown" id="gShown"></p>
      <button class="btn ghost" id="gLoad" type="button">Load more lights <span class="arr">↓</span></button>
    </div>
  </div>
</section>

<!-- Filter panel -->
<div class="g-scrim" id="gScrim" hidden></div>
<aside class="g-panel" id="gPanel" role="dialog" aria-modal="true" aria-labelledby="gPanelH" aria-hidden="true" inert>
  <div class="g-panel-h">
    <div><span class="eyebrow">Refine</span><h2 id="gPanelH">Filter the <em>gallery</em></h2></div>
    <button class="icon-btn" id="gPanelX" aria-label="Close filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="g-panel-b" id="gPanelB"></div>
  <div class="g-panel-f">
    <button class="link-u" id="gClear" type="button">Clear all</button>
    <button class="btn" id="gApply" type="button">Show results</button>
  </div>
</aside>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="assets/js/data-static.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/chat.js"></script>
<script src="assets/js/shop.js"></script>
</body>
</html>
